name: CI

# Runs the same checks that are expected to pass before a release is tagged.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Go
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Check formatting
        shell: pwsh
        run: |
          $unformatted = gofmt -l .
          if ($unformatted) {
            Write-Host "These files need gofmt:"
            Write-Host $unformatted
            exit 1
          }

      - name: Vet
        run: go vet ./...

      - name: Test
        # The tests read stored yt-dlp output from testdata and never use the
        # network, so they run the same way here as on a developer machine.
        run: go test ./... -race

  frontend:
    name: Frontend
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build
